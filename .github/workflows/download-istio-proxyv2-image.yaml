name: Download Istio proxy Images

on:
  workflow_dispatch:

jobs:
  download-images:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Istio proxy image
        run: |
          docker pull registry.istio.io/release/proxyv2:1.30.3

      - name: Save proxy image
        run: |
          docker save \
            registry.istio.io/release/proxyv2:1.30.3 \
            -o istio-proxyv2-1.30.3.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: istio-proxyv2-1.30.3
          path: istio-proxyv2-1.30.3.tar
          compression-level: 0
